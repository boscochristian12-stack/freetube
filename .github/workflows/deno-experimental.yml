name: Deno Experimental Runtime

on:
  push:
    branches:
      - deno-experimental
    paths:
      - 'DenoRuntime/**'
      - '.github/workflows/deno-experimental.yml'
  workflow_dispatch:

jobs:
  build-deno-runtime:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          rustc --version || true
          cargo --version || true

      - name: Install iOS Rust target
        run: |
          rustup target add aarch64-apple-ios

      - name: Prepare deno_core for iOS
        working-directory: DenoRuntime
        run: |
          cargo fetch
          TTY_RS="$(find "$HOME/.cargo/registry/src" -path '*/deno_core-0.412.0/uv_compat/tty.rs' -print -quit)"
          test -n "$TTY_RS"
          echo "Patching $TTY_RS"
          python3 - "$TTY_RS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = '''  /// Get a pointer to the thread-local errno value.
    #[cfg(target_os = "macos")]
    fn errno_location() -> *mut c_int {'''
          new = '''  /// Get a pointer to the thread-local errno value.
    #[cfg(any(target_os = "macos", target_os = "ios"))]
    fn errno_location() -> *mut c_int {'''
          if old not in text:
              raise SystemExit("expected global_termios errno_location block was not found")
          text = text.replace(old, new, 1)

          old = '#[cfg(not(any(target_os = "macos", target_os = "linux")))]'
          new = '#[cfg(not(any(target_os = "macos", target_os = "ios", target_os = "linux")))]'
          if old not in text:
              raise SystemExit("expected errno_location fallback cfg was not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          grep -n -A16 -B4 'Get a pointer to the thread-local errno value' "$TTY_RS"
          grep -n -A4 -B2 'pub(crate) enum TtyReactor' "$TTY_RS"

      - name: Build embedded Deno runtime for iOS
        working-directory: DenoRuntime
        env:
          RUSTFLAGS: "-C panic=abort"
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Inspect static library
        run: |
          LIB="DenoRuntime/target/aarch64-apple-ios/release/libfreetube_deno_runtime.a"
          test -f "$LIB"
          file "$LIB"
          xcrun lipo -info "$LIB" || true
          ls -lh "$LIB"
