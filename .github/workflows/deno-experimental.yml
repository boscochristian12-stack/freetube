name: Deno Experimental Runtime

on:
  push:
    branches:
      - deno-experimental
    paths:
      - 'DenoRuntime/**'
      - '.github/workflows/deno-experimental.yml'
  workflow_dispatch:

jobs:
  build-deno-runtime:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          rustc --version || true
          cargo --version || true

      - name: Install iOS Rust target
        run: |
          rustup target add aarch64-apple-ios

      - name: Build embedded Deno runtime for iOS
        working-directory: DenoRuntime
        env:
          RUSTFLAGS: "-C panic=abort"
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Inspect static library
        run: |
          LIB="DenoRuntime/target/aarch64-apple-ios/release/libfreetube_deno_runtime.a"
          test -f "$LIB"
          file "$LIB"
          xcrun lipo -info "$LIB" || true
          ls -lh "$LIB"
