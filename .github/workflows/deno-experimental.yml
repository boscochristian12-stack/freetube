name: Deno Experimental Runtime

on:
  push:
    branches:
      - deno-experimental
    paths:
      - 'DenoRuntime/**'
      - '.github/workflows/deno-experimental.yml'
  workflow_dispatch:

jobs:
  build-deno-runtime:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          rustc --version || true
          cargo --version || true

      - name: Install iOS Rust target
        run: |
          rustup target add aarch64-apple-ios

      # Native iOS compatibility patches are required before the first deno_core/V8 build.
      - name: Prepare deno_core and V8 for iOS
        working-directory: DenoRuntime
        run: |
          # cargo fetch sometimes exits 1 on the macOS runner after all registry
          # sources have been downloaded. Do not discard those sources; let the real
          # target build perform the final dependency verification.
          set +e
          cargo fetch -vv 2>&1 | tee "$RUNNER_TEMP/cargo-fetch.log"
          FETCH_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$FETCH_EXIT" -ne 0 ]; then
            echo "WARNING: cargo fetch exited with $FETCH_EXIT; continuing because the required sources were downloaded."
            tail -n 80 "$RUNNER_TEMP/cargo-fetch.log" || true
          fi

          TTY_RS="$(find "$HOME/.cargo/registry/src" -path '*/deno_core-0.412.0/uv_compat/tty.rs' -print -quit)"
          V8_ROOT="$(find "$HOME/.cargo/registry/src" -maxdepth 1 -type d -name 'v8-150.4.0' -print -quit)"
          V8_BINDING_CC="$V8_ROOT/src/binding.cc"
          ICU_DIR="$V8_ROOT/third_party/icu"

          test -n "$TTY_RS"
          test -n "$V8_ROOT"
          test -f "$V8_BINDING_CC"

          echo "Patching $TTY_RS"
          echo "Patching $V8_BINDING_CC"
          python3 patch-deno-core-ios.py "$TTY_RS" "$V8_BINDING_CC"

          # crates.io omits the large ICU data blobs from rusty_v8. Restore the
          # exact iOS data file from Deno's pinned rusty_v8 ICU branch.
          ICU_TMP="$RUNNER_TEMP/deno-icu"
          rm -rf "$ICU_TMP"
          git clone --depth 1 --filter=blob:none --sparse --branch rusty_v8 \\
            https://github.com/denoland/icu.git "$ICU_TMP"
          git -C "$ICU_TMP" sparse-checkout set ios/icudtl.dat

          mkdir -p "$ICU_DIR/ios"
          cp "$ICU_TMP/ios/icudtl.dat" "$ICU_DIR/ios/icudtl.dat"
          test -s "$ICU_DIR/ios/icudtl.dat"
          file "$ICU_DIR/ios/icudtl.dat"
          ls -lh "$ICU_DIR/ios/icudtl.dat"

          grep -n -A16 -B4 'Get a pointer to the thread-local errno value' "$TTY_RS"
          grep -n -A20 -B2 'v8::WasmModuleCompilation' "$V8_BINDING_CC"

      - name: Build embedded Deno runtime for iOS
        working-directory: DenoRuntime
        env:
          RUSTFLAGS: "-C panic=abort"
          V8_FROM_SOURCE: "1"
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Inspect static library
        run: |
          LIB="DenoRuntime/target/aarch64-apple-ios/release/libfreetube_deno_runtime.a"
          test -f "$LIB"
          file "$LIB"
          xcrun lipo -info "$LIB" || true
          ls -lh "$LIB"

      - name: Upload embedded Deno runtime
        uses: actions/upload-artifact@v4
        with:
          name: freetube-deno-runtime-ios
          path: |
            DenoRuntime/target/aarch64-apple-ios/release/libfreetube_deno_runtime.a
            DenoRuntime/include/freetube_deno.h
            DenoRuntime/Cargo.toml
          if-no-files-found: error
