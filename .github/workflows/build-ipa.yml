name: Build FreeTube iOS 27 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout FreeTube
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Show repository
        run: |
          git log -1 --oneline
          find FreeTube -maxdepth 3 -type f | sort | head -200

      # Make Swift Package Manager use the newest LNPopupUI source.
      # This pulls the current LNPopupUI/LNPopupController code,
      # including the iOS 27 minimization fixes.
      - name: Update LNPopupUI for iOS 27
        working-directory: FreeTube
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm

          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -resolvePackageDependencies

      - name: Verify LNPopupUI dependency
        working-directory: FreeTube
        run: |
          echo "Searching resolved Swift packages for LNPopupUI..."
          find . -name Package.resolved -print -exec grep -A12 -B3 -i "lnpopup" {} \; || true

      - name: Build unsigned iOS app
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Check built app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FreeTube.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: FreeTube.app was not created."
            exit 1
          fi

          echo "FreeTube.app successfully built:"
          du -sh "$APP_PATH"

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/FreeTube.app" \
            "Payload/FreeTube.app"

          zip -qry FreeTube-iOS27.ipa Payload

          echo "IPA created:"
          ls -lh FreeTube-iOS27.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-iOS27-IPA
          path: FreeTube-iOS27.ipa
          if-no-files-found: error
