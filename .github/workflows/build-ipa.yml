name: Build FreeTube IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeTube/FreeTube/Core/JavaScript/JSEvaluator.swift'
      - 'FreeTube/FreeTube/Core/JavaScript/PythonJSBridge.swift'
      - 'FreeTube/FreeTube/Core/JavaScript/DenoRuntimeBridge.swift'
      - 'FreeTube/FreeTube/Core/JavaScript/DenoRuntimeBridge.h'
      - 'FreeTube/FreeTube.xcodeproj/project.pbxproj'
      - 'DenoRuntime/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Find FreeTube popup code
        run: |
          echo "===== POPUP CODE ====="
          grep -R -n --include="*.swift" \
            -E '\.popup\(|popupBarInheritsBottomBarMetrics|tabBarMinimizeBehavior' \
            FreeTube || true

      - name: Clear Swift Package Manager caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf "$GITHUB_WORKSPACE/SourcePackages"
          rm -rf "$GITHUB_WORKSPACE/build"

      - name: Build embedded Deno runtime for iOS
        working-directory: DenoRuntime
        env:
          RUSTFLAGS: "-C panic=abort"
          V8_FROM_SOURCE: "1"
        run: |
          rustup target add aarch64-apple-ios
          # cargo fetch can report exit 1 after downloading the full registry set.
          # Keep the downloaded sources and let cargo build perform final verification.
          set +e
          cargo fetch -vv 2>&1 | tee "$RUNNER_TEMP/cargo-fetch.log"
          FETCH_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$FETCH_EXIT" -ne 0 ]; then
            echo "WARNING: cargo fetch exited with $FETCH_EXIT; continuing with downloaded sources."
            tail -n 80 "$RUNNER_TEMP/cargo-fetch.log" || true
          fi
          TTY_RS="$(find "$HOME/.cargo/registry/src" -path '*/deno_core-0.412.0/uv_compat/tty.rs' -print -quit)"
          V8_ROOT="$(find "$HOME/.cargo/registry/src" -maxdepth 1 -type d -name 'v8-150.4.0' -print -quit)"
          V8_BINDING_CC="$V8_ROOT/src/binding.cc"
          ICU_DIR="$V8_ROOT/third_party/icu"
          test -n "$TTY_RS"
          test -n "$V8_ROOT"
          test -f "$V8_BINDING_CC"
          python3 patch-deno-core-ios.py "$TTY_RS" "$V8_BINDING_CC"
          ICU_TMP="$RUNNER_TEMP/deno-icu"
          rm -rf "$ICU_TMP"
          git clone --depth 1 --filter=blob:none --sparse --branch rusty_v8 \
            https://github.com/denoland/icu.git "$ICU_TMP"
          git -C "$ICU_TMP" sparse-checkout set ios/icudtl.dat
          mkdir -p "$ICU_DIR/ios"
          cp "$ICU_TMP/ios/icudtl.dat" "$ICU_DIR/ios/icudtl.dat"
          test -s "$ICU_DIR/ios/icudtl.dat"
          file "$ICU_DIR/ios/icudtl.dat"
          ls -lh "$ICU_DIR/ios/icudtl.dat"
          cargo build --release --target aarch64-apple-ios

          mkdir -p "$GITHUB_WORKSPACE/FreeTube/DenoRuntime"
          cp target/aarch64-apple-ios/release/libfreetube_deno_runtime.a \
            "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/libfreetube_deno_runtime.a"
          cp include/freetube_deno.h \
            "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/freetube_deno.h"

          V8_LIB="$(find target -name 'librusty_v8.a' -type f -print -quit)"
          test -n "$V8_LIB"
          echo "Using Rusty V8 archive: $V8_LIB"
          cp "$V8_LIB" \
            "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/librusty_v8.a"

          file "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/libfreetube_deno_runtime.a"
          file "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/librusty_v8.a"
          ls -lh "$GITHUB_WORKSPACE/FreeTube/DenoRuntime"

      - name: Pin LNPopupController to 4.5.10 and LNPopupUI to 4.0.3
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          if not path.exists():
              print("ERROR: Package.resolved not found.")
              raise SystemExit(1)

          with path.open("r") as f:
              data = json.load(f)

          found = False

          for package in data.get("pins", []):
              if package.get("identity", "").lower() == "lnpopupcontroller":
                  found = True
                  package["state"]["version"] = "4.5.10"
                  package["state"]["revision"] = "47bc6662473cb957133753edab27d12b62722f2d"
              elif package.get("identity", "").lower() == "lnpopupui":
                  package["state"]["version"] = "4.0.3"
                  package["state"]["revision"] = "1efe75905087c98a31f56fa2ae835a0e561afb49"

          if not found:
              print("ERROR: LNPopupController was not found.")
              raise SystemExit(1)

          with path.open("w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("LNPopupController pinned to 4.5.10 and LNPopupUI pinned to 4.0.3")
          PY

      - name: Resolve Swift packages
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages"

      - name: Show resolved package versions
        run: |
          echo "===== RESOLVED PACKAGES ====="

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          with path.open() as f:
              data = json.load(f)

          for package in data.get("pins", []):
              identity = package.get("identity", "unknown")
              state = package.get("state", {})

              version = state.get("version")
              branch = state.get("branch")
              revision = state.get("revision")

              if version:
                  print(f"{identity}: {version}")
              elif branch:
                  print(f"{identity}: {branch} ({revision})")
              else:
                  print(f"{identity}: ({revision})")
          PY

      - name: Verify LNPopupController version
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          with path.open() as f:
              data = json.load(f)

          for package in data.get("pins", []):
              if package.get("identity", "").lower() == "lnpopupcontroller":
                  version = package.get("state", {}).get("version")
                  revision = package.get("state", {}).get("revision")

                  print(f"LNPopupController version: {version}")
                  print(f"LNPopupController revision: {revision}")

                  if version != "4.5.10":
                      print("ERROR: LNPopupController is not 4.5.10")
                      raise SystemExit(1)

                  raise SystemExit(0)

          print("ERROR: LNPopupController not found")
          raise SystemExit(1)
          PY

      - name: Build unsigned app
        working-directory: FreeTube
        run: |
          set +e

          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "        EXACT COMPILER ERRORS"
          echo "========================================"

          grep -n "error:" "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        ROOTVIEW.SWIFT"
          echo "========================================"

          grep -n -B 10 -A 15 "RootView.swift" \
            "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        SWIFT COMPILE"
          echo "========================================"

          grep -n -B 5 -A 20 "CompileSwift normal arm64" \
            "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        BUILD EXIT CODE"
          echo "========================================"

          echo "$BUILD_EXIT"

          exit "$BUILD_EXIT"

      - name: Verify built app
        if: success()
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/FreeTube.app"

          echo "Checking for:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: FreeTube.app was not created."
            exit 1
          fi

          echo ""
          echo "FreeTube.app successfully created."

      - name: Create IPA
        if: success()
        run: |
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R \
            "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/FreeTube.app" \
            "$GITHUB_WORKSPACE/Payload/FreeTube.app"

          cd "$GITHUB_WORKSPACE"

          zip -r FreeTube.ipa Payload

      - name: Verify IPA
        if: success()
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/FreeTube.ipa" ]; then
            echo "ERROR: FreeTube.ipa was not created."
            exit 1
          fi

          echo "IPA created successfully:"
          ls -lh "$GITHUB_WORKSPACE/FreeTube.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-IPA
          path: FreeTube.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-Build-Log
          path: build.log
          if-no-files-found: warn
