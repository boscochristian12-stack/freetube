name: Build FreeTube iOS 27 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout FreeTube
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Find project
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Remove old Swift Package resolution
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf SourcePackages

      - name: Update LNPopupUI dependency
        working-directory: FreeTube
        run: |
          PROJECT="FreeTube.xcodeproj/project.pbxproj"

          echo "===== LNPopupUI references BEFORE ====="
          grep -n -A12 -B4 "LNPopupUI" "$PROJECT" || true

          echo ""
          echo "===== Updating LNPopupUI package requirement ====="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("FreeTube.xcodeproj/project.pbxproj")
          text = path.read_text()

          # Find the LNPopupUI package reference and replace its
          # version requirement with an up-to-next-major requirement.
          pattern = r'(\bXCRemoteSwiftPackageReference\b.*?repositoryURL = "https://github\.com/LeoNatan/LNPopupUI\.git";.*?requirement = \{.*?kind = )[^;]+(;.*?\};)'
          
          match = re.search(pattern, text, re.DOTALL)

          if not match:
              print("Could not find LNPopupUI package reference using the expected format.")
              print("Searching for all LNPopupUI occurrences:")
              for line in text.splitlines():
                  if "LNPopupUI" in line:
                      print(line)
              raise SystemExit(1)

          old_block = match.group(0)

          new_block = re.sub(
              r'kind = [^;]+;',
              'kind = upToNextMajorVersion;',
              old_block,
              count=1
          )

          # Replace the version value if present.
          new_block = re.sub(
              r'(\bminimumVersion = )[^;]+;',
              r'\g<1>2.5.0;',
              new_block
          )

          text = text.replace(old_block, new_block)

          path.write_text(text)

          print("LNPopupUI dependency requirement updated.")
          PY

          echo ""
          echo "===== LNPopupUI references AFTER ====="
          grep -n -A12 -B4 "LNPopupUI" "$PROJECT" || true

      - name: Resolve Swift packages and update dependencies
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -scmProvider system

      - name: Verify resolved LNPopupUI version
        run: |
          echo "===== Package.resolved files ====="
          find . -name "Package.resolved" -print

          echo ""
          echo "===== LNPopupUI resolved version ====="

          RESOLVED="FreeTube/FreeTube.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          if [ ! -f "$RESOLVED" ]; then
            echo "ERROR: Package.resolved not found."
            exit 1
          fi

          python3 <<'PY'
          import json

          path = "FreeTube/FreeTube.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          with open(path, "r") as f:
              data = json.load(f)

          found = False

          for package in data.get("pins", []):
              identity = package.get("identity", "").lower()

              if identity == "lnpopupui":
                  found = True
                  state = package.get("state", {})

                  print("LNPopupUI version:", state.get("version"))
                  print("LNPopupUI revision:", state.get("revision"))

          if not found:
              print("ERROR: LNPopupUI was not found in Package.resolved")
              raise SystemExit(1)
          PY

      - name: Show LNPopupController dependency
        run: |
          echo "===== Searching LNPopupController ====="

          find SourcePackages -type f \
            \( -name "Package.swift" -o -name "*.podspec" \) \
            -print0 2>/dev/null |
          while IFS= read -r -d '' file; do
            if grep -qi "LNPopupController" "$file"; then
              echo ""
              echo "===== $file ====="
              grep -i -A8 -B4 "LNPopupController" "$file" || true
            fi
          done

      - name: Build unsigned app
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify FreeTube.app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FreeTube.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: FreeTube.app was not built."
            exit 1
          fi

          echo "===== Build successful ====="
          du -sh "$APP_PATH"

          echo ""
          echo "===== Frameworks ====="
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -print || true

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/FreeTube.app" \
            "Payload/FreeTube.app"

          zip -qry FreeTube-iOS27.ipa Payload

          echo ""
          echo "===== IPA created ====="
          ls -lh FreeTube-iOS27.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-iOS27-IPA
          path: FreeTube-iOS27.ipa
          if-no-files-found: error
