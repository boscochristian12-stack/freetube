name: Build FreeTube iOS 27 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout FreeTube
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Find project
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Show existing package resolution
        run: |
          echo "===== Existing Package.resolved ====="

          RESOLVED="FreeTube/FreeTube.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          if [ ! -f "$RESOLVED" ]; then
            echo "ERROR: Package.resolved was not found."
            exit 1
          fi

          cat "$RESOLVED"

      - name: Update only LNPopupController
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          with path.open("r") as f:
              data = json.load(f)

          found = False

          for package in data.get("pins", []):
              identity = package.get("identity", "").lower()

              if identity == "lnpopupcontroller":
                  found = True

                  print("===== LNPopupController BEFORE =====")
                  print("Version:", package["state"].get("version"))
                  print("Revision:", package["state"].get("revision"))

                  # LNPopupController 4.5.8
                  package["state"]["version"] = "4.5.8"
                  package["state"]["revision"] = "d8f3d48"

                  print("")
                  print("===== LNPopupController AFTER =====")
                  print("Version:", package["state"]["version"])
                  print("Revision:", package["state"]["revision"])

          if not found:
              print("ERROR: LNPopupController was not found in Package.resolved.")
              raise SystemExit(1)

          with path.open("w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Verify package versions
        run: |
          python3 <<'PY'
          import json

          path = (
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          with open(path, "r") as f:
              data = json.load(f)

          print("===== IMPORTANT PACKAGE VERSIONS =====")

          for package in data.get("pins", []):
              identity = package.get("identity", "").lower()

              if identity in ["lnpopupui", "lnpopupcontroller", "youtubedl-ios"]:
                  state = package.get("state", {})

                  print("")
                  print(identity)
                  print("  version :", state.get("version"))
                  print("  revision:", state.get("revision"))
          PY

      - name: Clear only build caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf SourcePackages

      - name: Resolve packages using existing lockfile
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -resolvePackageDependencies \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -scmProvider system

      - name: Verify resolved LNPopupController
        run: |
          echo "===== FINAL PACKAGE RESOLUTION ====="

          python3 <<'PY'
          import json

          path = (
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          with open(path, "r") as f:
              data = json.load(f)

          for package in data.get("pins", []):
              identity = package.get("identity", "").lower()

              if identity in ["lnpopupui", "lnpopupcontroller"]:
                  state = package.get("state", {})

                  print(
                      f"{identity}: "
                      f"{state.get('version')} "
                      f"({state.get('revision')})"
                  )

          PY

      - name: Build unsigned app
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify FreeTube.app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FreeTube.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: FreeTube.app was not built."
            exit 1
          fi

          echo "===== BUILD SUCCESSFUL ====="
          du -sh "$APP_PATH"

          echo ""
          echo "===== FRAMEWORKS ====="
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -print || true

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/FreeTube.app" \
            "Payload/FreeTube.app"

          zip -qry FreeTube-iOS27.ipa Payload

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh FreeTube-iOS27.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-iOS27-IPA
          path: FreeTube-iOS27.ipa
          if-no-files-found: error
