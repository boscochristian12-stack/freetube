name: Build FreeTube IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeTube/FreeTube/Core/JavaScript/JSEvaluator.swift'
      - 'FreeTube/FreeTube/App/RootView.swift'
      - 'FreeTube/FreeTube/Core/JavaScript/PythonJSBridge.swift'
      - 'FreeTube/FreeTube/Core/JavaScript/DenoRuntimeBridge.swift'
      - 'FreeTube/FreeTube/Core/JavaScript/DenoRuntimeBridge.h'
      - 'FreeTube/FreeTube.xcodeproj/project.pbxproj'
      - 'DenoRuntime/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Find FreeTube popup code
        run: |
          echo "===== POPUP CODE ====="
          grep -R -n --include="*.swift" \
            -E '\.popup\(|popupBarInheritsBottomBarMetrics|tabBarMinimizeBehavior' \
            FreeTube || true

      - name: Clear Swift Package Manager caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf "$GITHUB_WORKSPACE/SourcePackages"
          rm -rf "$GITHUB_WORKSPACE/build"

      - name: Build embedded Deno runtime for iOS
        working-directory: DenoRuntime
        env:
          RUSTFLAGS: "-C panic=abort"
          # Build V8 from source with the CppGC 4 GB caged heap disabled.
          # The crash report shows V8 dying in CagedHeap::ReserveCagedHeap()
          # on iOS 27 while initializing the embedded Deno runtime.
          # iOS does not need this desktop-oriented virtual-address reservation
          # for our EJS workload, and V8 supports disabling it at GN build time.
          V8_FROM_SOURCE: "1"
          GN_ARGS: >-
            v8_enable_sandbox=false
            v8_enable_pointer_compression=false
            cppgc_enable_caged_heap=false
            cppgc_enable_pointer_compression=false
        run: |
          set -e
          rustup target add aarch64-apple-ios
          cargo fetch --target aarch64-apple-ios

          # The crates.io v8-150.4.0 source package is missing the iOS ICU data blob,
          # but its GN build requires it. Restore the exact ICU revision pinned by
          # rusty_v8 150.4.0 before
          # invoking Cargo's V8 build. This keeps the CppGC/source build enabled
          # instead of falling back to a prebuilt V8 archive with different GN args.
          V8_CRATE_DIR="$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -path '*/v8-150.4.0' -print -quit)"
          test -n "$V8_CRATE_DIR"
          ICU_DATA="$V8_CRATE_DIR/third_party/icu/ios/icudtl.dat"
          mkdir -p "$(dirname "$ICU_DATA")"
          # Gitiles serves repository files reliably through ?format=TEXT.
          # Decode the base64 response instead of using the +download endpoint,
          # which the macOS runner's curl rejected as a malformed host.
          ICU_DATA_B64="$(mktemp)"
          curl --fail --location --retry 3 "https://chromium.googlesource.com/chromium/deps/icu/+/ee5f27adc28bd3f15b2c293f726d14d2e336cbd5/ios/icudtl.dat?format=TEXT" --output "$ICU_DATA_B64"
          base64 --decode < "$ICU_DATA_B64" > "$ICU_DATA"
          rm -f "$ICU_DATA_B64"
          test -s "$ICU_DATA"
          echo "Restored exact rusty_v8 150.4.0 iOS ICU data:"
          ls -lh "$ICU_DATA"

          # rusty_v8 150.4.0 vendors several Chromium Rust crates inside the
          # crates.io V8 source package. The package is missing build.rs for
          # icu_calendar_data 2.0.0, but GN still generates a target for that
          # build script. Restore the exact published crate file before Ninja
          # runs instead of weakening or skipping the V8 source build.
          ICU_CALENDAR_DATA_DIR="$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor/icu_calendar_data-v2"
          if [ ! -f "$ICU_CALENDAR_DATA_DIR/build.rs" ]; then
            ICU_CALENDAR_DATA_TGZ="$(mktemp)"
            curl --fail --location --retry 3 \
              "https://crates.io/api/v1/crates/icu_calendar_data/2.0.0/download" \
              --output "$ICU_CALENDAR_DATA_TGZ"
            mkdir -p "$ICU_CALENDAR_DATA_DIR"
            tar -xzf "$ICU_CALENDAR_DATA_TGZ" -C "$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor"
            mv "$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor/icu_calendar_data-2.0.0/build.rs" \
              "$ICU_CALENDAR_DATA_DIR/build.rs"
            rm -rf "$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor/icu_calendar_data-2.0.0" "$ICU_CALENDAR_DATA_TGZ"
          fi
          test -f "$ICU_CALENDAR_DATA_DIR/build.rs"
          echo "Restored icu_calendar_data 2.0.0 build.rs:"
          ls -lh "$ICU_CALENDAR_DATA_DIR/build.rs"
          # The same crates.io packaging gap affects icu_locale_data 2.0.0.
          # GN references its vendored build script, so restore the exact published
          # crate file before Ninja reaches that target.
          ICU_LOCALE_DATA_DIR="$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor/icu_locale_data-v2"
          if [ ! -f "$ICU_LOCALE_DATA_DIR/build.rs" ]; then
            ICU_LOCALE_DATA_TGZ="$(mktemp)"
            curl --fail --location --retry 3 \
              "https://crates.io/api/v1/crates/icu_locale_data/2.0.0/download" \
              --output "$ICU_LOCALE_DATA_TGZ"
            mkdir -p "$ICU_LOCALE_DATA_DIR"
            tar -xzf "$ICU_LOCALE_DATA_TGZ" -C "$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor"
            mv "$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor/icu_locale_data-2.0.0/build.rs" \
              "$ICU_LOCALE_DATA_DIR/build.rs"
            rm -rf "$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor/icu_locale_data-2.0.0" "$ICU_LOCALE_DATA_TGZ"
          fi
          test -f "$ICU_LOCALE_DATA_DIR/build.rs"
          echo "Restored icu_locale_data 2.0.0 build.rs:"
          ls -lh "$ICU_LOCALE_DATA_DIR/build.rs"

          TTY_RS="$(find "$HOME/.cargo/registry/src" -path '*/deno_core-0.412.0/uv_compat/tty.rs' -print -quit)"
          test -n "$TTY_RS"
          python3 patch-deno-core-ios.py "$TTY_RS"
          # rusty_v8 150.4.0's crates.io source archive is missing some
          # Chromium-vendored Rust build scripts even though the generated GN
          # graph requires them. We already restore the known ICU scripts above.
          # If Ninja exposes another missing vendor/*/build.rs, restore that
          # exact published crate file from crates.io and retry.
          V8_VENDOR_DIR="$V8_CRATE_DIR/third_party/rust/chromium_crates_io/vendor"
          V8_BUILD_LOG="$GITHUB_WORKSPACE/v8-cargo-build.log"
          rm -f "$V8_BUILD_LOG"
          V8_BUILD_OK=0

          for V8_ATTEMPT in $(seq 1 12); do
            echo "===== Rusty V8 build attempt $V8_ATTEMPT/12 ====="
            set +e
            cargo build --release --target aarch64-apple-ios 2>&1 | tee "$V8_BUILD_LOG"
            V8_BUILD_EXIT=${PIPESTATUS[0]}
            set -e

            if [ "$V8_BUILD_EXIT" -eq 0 ]; then
              V8_BUILD_OK=1
              break
            fi

            MISSING_BUILD_RS="$(grep -oE 'vendor/[^[:space:]'"'"']+/build\\.rs' "$V8_BUILD_LOG" | tail -1 || true)"
            if [ -z "$MISSING_BUILD_RS" ]; then
              echo "V8 build failed without a missing vendored build.rs path; stopping retries."
              exit "$V8_BUILD_EXIT"
            fi

            MISSING_REL="${MISSING_BUILD_RS#*vendor/}"
            MISSING_CRATE_DIR="$V8_VENDOR_DIR/${MISSING_REL%/build.rs}"
            MISSING_TOML="$MISSING_CRATE_DIR/Cargo.toml"
            echo "Ninja reports missing: $MISSING_BUILD_RS"
            echo "Vendored crate directory: $MISSING_CRATE_DIR"

            if [ ! -f "$MISSING_TOML" ]; then
              echo "ERROR: vendored Cargo.toml is missing for $MISSING_CRATE_DIR"
              exit "$V8_BUILD_EXIT"
            fi

            CRATE_NAME="$(sed -n 's/^name = "\\(.*\\)"$/\\1/p' "$MISSING_TOML" | head -1)"
            CRATE_VERSION="$(sed -n 's/^version = "\\(.*\\)"$/\\1/p' "$MISSING_TOML" | head -1)"
            if [ -z "$CRATE_NAME" ] || [ -z "$CRATE_VERSION" ]; then
              echo "ERROR: could not determine crate name/version from $MISSING_TOML"
              exit "$V8_BUILD_EXIT"
            fi

            echo "Restoring published crate: $CRATE_NAME $CRATE_VERSION"
            CRATE_TGZ="$(mktemp)"
            CRATE_TMP="$(mktemp -d)"
            curl --fail --location --retry 3 \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION/download" \
              --output "$CRATE_TGZ"
            tar -xzf "$CRATE_TGZ" -C "$CRATE_TMP"

            PUBLISHED_BUILD_RS="$(find "$CRATE_TMP" -type f -name build.rs -print -quit)"
            if [ -z "$PUBLISHED_BUILD_RS" ]; then
              echo "ERROR: crates.io package $CRATE_NAME $CRATE_VERSION has no build.rs"
              rm -rf "$CRATE_TGZ" "$CRATE_TMP"
              exit "$V8_BUILD_EXIT"
            fi

            mkdir -p "$MISSING_CRATE_DIR"
            cp "$PUBLISHED_BUILD_RS" "$MISSING_CRATE_DIR/build.rs"
            rm -rf "$CRATE_TGZ" "$CRATE_TMP"
            test -f "$MISSING_CRATE_DIR/build.rs"
            echo "Restored: $MISSING_CRATE_DIR/build.rs"
          done

          if [ "$V8_BUILD_OK" -ne 1 ]; then
            echo "ERROR: Rusty V8 did not build successfully after 12 attempts."
            exit 101
          fi


          mkdir -p "$GITHUB_WORKSPACE/FreeTube/DenoRuntime"
          cp target/aarch64-apple-ios/release/libfreetube_deno_runtime.a \
            "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/libfreetube_deno_runtime.a"
          cp include/freetube_deno.h \
            "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/freetube_deno.h"


          file "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/libfreetube_deno_runtime.a"
          ls -lh "$GITHUB_WORKSPACE/FreeTube/DenoRuntime"

          # iOS device builds of Rusty V8 disable WebAssembly. The generated
          # Rust bindings still expose the WasmModuleCompilation constructor
          # and destructor, so the final link needs harmless definitions for
          # those unused symbols. This stub is intentionally limited to the
          # experimental branch and is not part of the runtime API.
          cat > "$GITHUB_WORKSPACE/V8WasmIOSStubs.cpp" <<'CPP'
          namespace v8 {
          class WasmModuleCompilation {
          public:
              WasmModuleCompilation();
              ~WasmModuleCompilation();
          };

          WasmModuleCompilation::WasmModuleCompilation() {}
          WasmModuleCompilation::~WasmModuleCompilation() {}
          }
          CPP

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang++ \
            -target arm64-apple-ios17.0 \
            -isysroot "$SDK_PATH" \
            -fno-rtti \
            -fno-exceptions \
            -c "$GITHUB_WORKSPACE/V8WasmIOSStubs.cpp" \
            -o "$GITHUB_WORKSPACE/V8WasmIOSStubs.o"
          libtool -static \
            -o "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/libv8_ios_stubs.a" \
            "$GITHUB_WORKSPACE/V8WasmIOSStubs.o"
          file "$GITHUB_WORKSPACE/FreeTube/DenoRuntime/libv8_ios_stubs.a"

      - name: Verify LNPopupUI is removed
        run: |
          set -e
          if grep -R -n -E 'LNPopupUI|LNPopupController|lnpopupui|lnpopupcontroller' FreeTube/FreeTube.xcodeproj FreeTube/FreeTube.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "ERROR: LNPopupUI/LNPopupController references remain in the Xcode project or package resolution."
            exit 1
          fi
          echo "LNPopupUI and LNPopupController references are removed."

      - name: Resolve Swift packages
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages"

      - name: Show resolved package versions
        run: |
          echo "===== RESOLVED PACKAGES ====="

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "FreeTube/FreeTube.xcodeproj/project.xcworkspace/"
              "xcshareddata/swiftpm/Package.resolved"
          )

          with path.open() as f:
              data = json.load(f)

          for package in data.get("pins", []):
              identity = package.get("identity", "unknown")
              state = package.get("state", {})

              version = state.get("version")
              branch = state.get("branch")
              revision = state.get("revision")

              if version:
                  print(f"{identity}: {version}")
              elif branch:
                  print(f"{identity}: {branch} ({revision})")
              else:
                  print(f"{identity}: ({revision})")
          PY

      - name: Build unsigned app
        working-directory: FreeTube
        run: |
          set +e

          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -force_load $(SRCROOT)/DenoRuntime/libfreetube_deno_runtime.a -force_load $(SRCROOT)/DenoRuntime/libv8_ios_stubs.a -lc++' \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "        EXACT COMPILER ERRORS"
          echo "========================================"

          grep -n -E 'error:|undefined symbols|Undefined symbols|ld:|clang: error' "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        LINKER CONTEXT"
          echo "========================================"
          grep -n -B 8 -A 30 -E 'Ld |Undefined symbols|duplicate symbol|duplicate symbols' "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        ROOTVIEW.SWIFT"
          echo "========================================"

          grep -n -B 10 -A 15 "RootView.swift" \
            "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        SWIFT COMPILE"
          echo "========================================"

          grep -n -B 5 -A 20 "CompileSwift normal arm64" \
            "$GITHUB_WORKSPACE/build.log" || true

          echo ""
          echo "========================================"
          echo "        BUILD EXIT CODE"
          echo "========================================"

          echo "$BUILD_EXIT"

          exit "$BUILD_EXIT"

      - name: Verify built app
        if: success()
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/FreeTube.app"

          echo "Checking for:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: FreeTube.app was not created."
            exit 1
          fi

          echo ""
          echo "FreeTube.app successfully created."

      - name: Create IPA
        if: success()
        run: |
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R \
            "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/FreeTube.app" \
            "$GITHUB_WORKSPACE/Payload/FreeTube.app"

          cd "$GITHUB_WORKSPACE"

          zip -r FreeTube.ipa Payload

      - name: Verify IPA
        if: success()
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/FreeTube.ipa" ]; then
            echo "ERROR: FreeTube.ipa was not created."
            exit 1
          fi

          echo "IPA created successfully:"
          ls -lh "$GITHUB_WORKSPACE/FreeTube.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-IPA
          path: FreeTube.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-Build-Log
          path: build.log
          if-no-files-found: warn
