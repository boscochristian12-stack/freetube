name: Build FreeTube iOS 27 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout FreeTube
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Find FreeTube project
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Remove old package resolution
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf SourcePackages

      - name: Resolve Swift packages
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages"

      - name: Show resolved LNPopupUI version
        run: |
          echo "===== Searching for LNPopupUI ====="
          find . -name "Package.resolved" -print

          echo "===== LNPopupUI entries ====="
          grep -R -A15 -B5 \
            '"identity" : "lnpopupui"\|"identity": "lnpopupui"\|"LNPopupUI"' \
            --include="Package.resolved" \
            . || true

      - name: Build unsigned app
        working-directory: FreeTube
        run: |
          xcodebuild \
            -project FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify FreeTube.app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FreeTube.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: FreeTube.app was not built."
            exit 1
          fi

          echo "Build successful:"
          du -sh "$APP_PATH"

          echo ""
          echo "Frameworks:"
          find "$APP_PATH/Frameworks" -maxdepth 1 -type d -print || true

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/FreeTube.app" \
            "Payload/FreeTube.app"

          zip -qry FreeTube-iOS27.ipa Payload

          echo "Created:"
          ls -lh FreeTube-iOS27.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-iOS27-IPA
          path: FreeTube-iOS27.ipa
          if-no-files-found: error
